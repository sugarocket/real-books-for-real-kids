<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Open book - left page (lavender) -->
  <path d="M8 14 Q14 10 20 14 L20 32 Q14 36 8 32 Z" fill="#C4B5FD" stroke="#A5B4FC" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Open book - right page (mint) -->
  <path d="M28 14 Q34 10 40 14 L40 32 Q34 36 28 32 Z" fill="#6EE7B7" stroke="#34D399" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Book spine -->
  <line x1="20" y1="14" x2="20" y2="32" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round"/>
  <!-- Magic wand -->
  <line x1="22" y1="28" x2="32" y2="16" stroke="#A5B4FC" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Stylized sun at wand tip -->
  <circle cx="33" cy="15" r="4" fill="#FDE047" stroke="#FACC15" stroke-width="1.5"/>
  <!-- Sun rays -->
  <g stroke="#FDE047" stroke-width="1.5" stroke-linecap="round">
    <line x1="33" y1="8" x2="33" y2="4.5"/>
    <line x1="39" y1="12" x2="42" y2="9"/>
    <line x1="27" y1="12" x2="24" y2="9"/>
    <line x1="39" y1="18" x2="42" y2="21"/>
    <line x1="27" y1="18" x2="24" y2="21"/>
  </g>
  <!-- Sparkles -->
  <circle cx="27" cy="11" r="1.5" fill="#FDE047"/>
  <circle cx="36" cy="9" r="1" fill="#FDE047"/>
</svg>
